<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source</title>
<!--
  Source for assets/img/og-image.jpg (1200x630, the link-preview card).
  Render it headless at exactly 1200x630 and save the screenshot over that
  file. Kept in the repo because the card bakes in the hero line and has to
  be regenerated whenever that line changes.

    python3 -m http.server 8899
    <chrome> --headless --window-size=1200,630 \
      --screenshot=assets/img/og-image.jpg \
      http://127.0.0.1:8899/tools/og-image.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f6f2ea; --ink: #16150f; --ink-2: #5c574c; --ink-3: #6b6455;
    --accent: #bd5333; --accent-wash: #e9cec1;
    --display: "Instrument Serif", Georgia, serif;
    --font: "Inter", -apple-system, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    display: grid; grid-template-columns: 1fr 460px;
    align-items: center; gap: 40px; padding: 0 80px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 14px;
    margin: 0 0 26px; font-size: 15px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  }
  .logo {
    display: inline-grid; place-items: center;
    width: 42px; height: 42px; background: var(--ink); color: var(--bg);
    font-family: "Archivo", var(--font); font-weight: 700;
    font-size: 17px; letter-spacing: 0.06em;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: 92px; line-height: 1; letter-spacing: -0.015em;
    margin: 0 0 20px;
  }
  .role {
    display: flex; align-items: center; gap: 18px;
    margin: 0 0 26px; font-size: 15px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  }
  .role::after { content: ""; flex: 1; height: 1px; background: #ddd5c5; }
  .line { font-size: 26px; line-height: 1.45; color: var(--ink-2); margin: 0; max-width: 20em; }
  .line b { color: var(--ink); font-weight: 600; }
  .mark {
    background: var(--accent-wash); color: var(--ink);
    padding: 0 0.22em; white-space: nowrap;
  }
  .portrait { position: relative; width: 420px; height: 420px; justify-self: end; }
  .portrait::before {
    content: ""; position: absolute; inset: 0;
    transform: translate(7%, 7%); background: var(--accent); border-radius: 50%;
  }
  .portrait img {
    position: relative; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 22%; border-radius: 50%;
  }
</style>
</head>
<body>
  <div>
    <p class="chip"><span class="logo">AB</span><span class="dot"></span>Open to new roles</p>
    <h1>Aman Baid</h1>
    <p class="role">Product Manager &middot; Mumbai, India</p>
    <p class="line">A spec is a guess until someone builds it.
      <span class="mark">So I build it,</span> ship it, and let the data decide.</p>
  </div>
  <figure class="portrait">
    <img src="../assets/img/aman-baid@2x.jpg" alt="Aman Baid">
  </figure>
</body>
</html>
