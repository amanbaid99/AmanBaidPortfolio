name: Deploy to GitHub Pages

# Manual trigger only.
#
# This repo currently publishes via Settings > Pages > "Deploy from a branch",
# which is GitHub's own build and needs no workflow. This file is kept for the
# day you switch Source to "GitHub Actions" instead.
#
# Do NOT add a push trigger while Source is set to "Deploy from a branch":
# actions/deploy-pages only works when Source is "GitHub Actions", so the run
# would fail every time. Switch Source first, then add:
#   push:
#     branches: [master]
on:
  workflow_dispatch:

# Permissions the deploy needs. GITHUB_TOKEN gets nothing beyond these.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so the live site is
# never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # enablement: true turns GitHub Pages on for the repo if it isn't
      # already, so there is no manual step in Settings.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # No build step — the repo root is the site. This action excludes
      # .git and .github from the uploaded artifact.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
